name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            file: indefessus
            asset: indefessus-linux-x86_64
            selftest: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            file: indefessus
            asset: indefessus-linux-arm64
            selftest: true
          - os: macos-latest
            target: aarch64-apple-darwin
            file: indefessus
            asset: indefessus-macos-arm64
            selftest: true
          - os: macos-latest
            target: x86_64-apple-darwin
            file: indefessus
            asset: indefessus-macos-x86_64
            selftest: false   # built for Intel Macs on an Apple Silicon runner
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            file: indefessus.exe
            asset: indefessus-windows-x86_64.exe
            selftest: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - if: ${{ matrix.selftest }}
        run: ./target/${{ matrix.target }}/release/${{ matrix.file }} selftest
        shell: bash
      - shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.file }} ${{ matrix.asset }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
