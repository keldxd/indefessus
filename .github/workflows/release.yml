name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            file: indefessus
            asset: indefessus-linux-x86_64
            selftest: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            file: indefessus
            asset: indefessus-linux-arm64
            selftest: true
          - os: macos-latest
            target: aarch64-apple-darwin
            file: indefessus
            asset: indefessus-macos-arm64
            selftest: true
          - os: macos-latest
            target: x86_64-apple-darwin
            file: indefessus
            asset: indefessus-macos-x86_64
            selftest: false   # built for Intel Macs on an Apple Silicon runner
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            file: indefessus.exe
            asset: indefessus-windows-x86_64.exe
            selftest: true
    runs-on: ${{ matrix.os }}
    steps:
      # Third-party actions are pinned to a commit, so a moved tag cannot change what runs here
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - if: ${{ matrix.selftest }}
        run: ./target/${{ matrix.target }}/release/${{ matrix.file }} selftest
        shell: bash
      - shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.file }} ${{ matrix.asset }}
          # A checksum next to each download, so people can check the file they got is the one built here
          if command -v sha256sum >/dev/null; then
            sha256sum ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          else
            shasum -a 256 ${{ matrix.asset }} > ${{ matrix.asset }}.sha256
          fi
          cat ${{ matrix.asset }}.sha256
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
